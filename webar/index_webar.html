<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@r127/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/helper.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }
    canvas {
      display: block;
    }
  </style>
</head>

<body>

  <canvas id="my-canvas"></canvas>

  <script>
    const mindarThree = new window.MINDAR.IMAGE.MindARThree({
      container: document.body,
      imageTargetSrc: 'assets/targets.mind', // Archivo compilado de targets
    });

    const { renderer, scene, camera } = mindarThree;

    // Crear grupo para el marcador
    const anchor = mindarThree.addAnchor(0); // 0 es el índice del marcador

    // Crear geometría y material para mostrar (similar a tu imagen)
    const geometry = new THREE.PlaneGeometry(1.5, 2.6);
    const textureLoader = new THREE.TextureLoader();
    const texture = textureLoader.load('assets/asset_leon.png');
    const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.z = 0;

    anchor.group.add(mesh);

    // Iniciar
    mindarThree.start();
    renderer.setAnimationLoop(() => renderer.render(scene, camera));
  </script>

</body>
</html>
